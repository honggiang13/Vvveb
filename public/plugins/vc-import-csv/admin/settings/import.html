<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="/favicon.ico">

  <base href="../">

  <title>Vvveb - VC Import CSV - Import Progress</title>

  <link href="css/admin.css" rel="stylesheet">
  <link href="libs/media/media.css" rel="stylesheet">
</head>


<body>

  <div id="container">

    <div class="sidebar" data-v-copy-from="index.html,.sidebar">
    </div>


    <div class="main">

      <div class="clearfix top-header" data-v-copy-from="index.html,.top-header">

      </div>

        <div class="actions">
          <div class="title">
            <h4 class="text-muted mt-2">
              <i class="icon-cube-outline"></i>
              Import CSV
            </h4>
          </div>
          <div class="btns">
			<a href="{$this.adminPath}index.php?module=plugin/plugins" title="Plugins list"
					class="btn btn-icon btn-outline-secondary me-2">
						<i class="la la-arrow-left"></i><span>Plugins list</span>
			</a>  
          </div>
        </div>
        <div>
          <div id="main-content">

          	<div class="notifications" data-v-notifications data-v-copy-from="index.html,.notifications"></div>

            <div class="content clearfix settings">

              {$this.errors}

              <!-- Import progress card -->
              <div class="card my-4">
                <div class="card-body">
                  <h5 class="card-title">Tiến độ import</h5>
                  <p class="card-text">Quá trình import đang chạy. Đừng đóng trang này.</p>

                  <div id="progress" class="px-2">
                    <div id="progress-backup" class="progress mb-3">
                      <div id="progress-bar" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>

                    <div class="mt-2 mb-5">
                      <span id="progress-file" class="badge bg-secondary me-2">{$this.file}</span>
                      <strong id="progress-status">Đang khởi tạo...</strong>
                      <span id="progress-page"></span> -
                      <span id="progress-position" class="d-none"></span>
                      <span id="progress-count" class="badge bg-primary ms-2">{$this.count}</span>
                    </div>
                  </div>

                  <div class="mt-4">
                    <a href="{$this.adminPath}index.php?module=plugin/plugins" class="btn btn-outline-secondary">Về danh sách plugin</a>
                  </div>
                </div>
              </div>

            </div>
          </div>
    </div>
  </div>
	
	<div class="toast-container">
		<div class="toast position-fixed end-0 bottom-0 me-4 my-4" role="alert" aria-live="assertive" aria-atomic="true" id="bottom-toast">
		  <div class="toast-header bg-success bg-opacity-25 border-0">
			<strong class="me-auto">Thông báo</strong>
			
			<button type="button" class="btn-close me-1" data-bs-dismiss="toast" aria-label="Close"></button>
		  </div>
		  <div class="toast-body ">
			<div class="flex-grow-1">
			  <div class="message"></div>
			  <div>				
			  </div>
			</div>
		  </div>
		</div>
	</div>	
	
<style>
.format-btn .btn {
    padding-left: 2rem;
}

.format-btn .btn-check {
	margin: 0.5rem;
	clip: unset;
	pointer-events:all;
	z-index:1;
}

.format-btn .btn-check:checked {
	color:#fff;
	border-color:#fff;
}
</style>	
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script id="admin-js" type="module" src="/js/admin.js"></script>
<script src="/plugins/vc-import-csv/js/import.js"></script>
<script>
var vcProvider = '{$this.provider}';
var vcColumn = {$this.column};
var vcNextUrl = '{$this.nextUrl}';
var vcPosition = 0;
var vcCount = 0;

window.addEventListener('load', function() {
   if (typeof ImportController !== 'undefined') {
      var importCsv = new ImportController();
      importCsv.init(vcProvider, vcColumn, vcNextUrl);
   }
});
</script>
</body>
</html>
