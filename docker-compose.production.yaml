version: "3.8"

# Build behavior:
# - db (image: mysql:8.0): không rebuild, chỉ pull khi dùng `docker compose build --pull`
# - php (build: .): luôn rebuild từ source code ở mỗi deploy
# - Để force rebuild TẤT CẢ services (gồm cả db): set COOLIFY_FORCE_BUILD=true và dùng `docker compose build --pull`
# - Mặc định chỉ rebuild php (source app web), giữ nguyên container mysql đã có

services:
  db:
    image: mysql:8.0
    container_name: vvveb-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vvveb}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vvveb}
      MYSQL_USER: ${MYSQL_USER:-vvveb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vvveb}
      # Khi COOLIFY_FORCE_BUILD=true + docker compose build --pull, image mysql sẽ được pull lại
      COOLIFY_FORCE_BUILD: ${COOLIFY_FORCE_BUILD:-false}
    volumes:
      - vvveb_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vvveb_network

  php:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: vvveb-app
    restart: always
    # Không expose port 80 trực tiếp - Coolify Traefik sẽ proxy qua labels
    # ports:
    #   - "80:80"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.vvveb.loadbalancer.server.port=80"
    environment:
      VVVEB_HOST: db
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-vvveb}
      DB_USER: ${MYSQL_USER:-vvveb}
      DB_PASSWORD: ${MYSQL_PASSWORD:-vvveb}
      DB_ENGINE: mysqli
      AUTO_INSTALL: "false"
      # Chạy container dưới user www-data để phù hợp quyền file
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
      # Secret — thiết lập trên Coolify Variables, KHÔNG hardcode
      APP_KEY: ${APP_KEY}
      CRON_KEY: ${CRON_KEY}
      DEBUG: ${DEBUG:-false}
      PAGE_CACHE: ${PAGE_CACHE:-false}
      SQL_CHECK: ${SQL_CHECK:-false}
      # Khi COOLIFY_FORCE_BUILD=true + docker compose build --pull, tất cả services (gồm cả db) sẽ được rebuild
      COOLIFY_FORCE_BUILD: ${COOLIFY_FORCE_BUILD:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persistent runtime data (không mount source code để tránh ghi đè image build)
      - vvveb_storage:/var/www/html/storage
      - vvveb_page_cache:/var/www/html/public/page-cache
    networks:
      - vvveb_network

volumes:
  vvveb_db_data:
  vvveb_storage:
  vvveb_page_cache:

networks:
  vvveb_network:
    driver: bridge
