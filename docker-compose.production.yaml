version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: vvveb-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vvveb}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vvveb}
      MYSQL_USER: ${MYSQL_USER:-vvveb}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vvveb}
    volumes:
      - vvveb_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - vvveb_network

  php:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: vvveb-app
    restart: always
    # Không expose port 80 trực tiếp - Coolify Traefik sẽ proxy qua labels
    # ports:
    #   - "80:80"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vvveb.rule=Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.vvveb.entrypoints=web"
      - "traefik.http.services.vvveb.loadbalancer.server.port=80"
    environment:
      VVVEB_HOST: db
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-vvveb}
      DB_USER: ${MYSQL_USER:-vvveb}
      DB_PASSWORD: ${MYSQL_PASSWORD:-vvveb}
      DB_ENGINE: mysqli
      AUTO_INSTALL: "false"
      # Secret — thiết lập trên Coolify Variables, KHÔNG hardcode
      APP_KEY: ${APP_KEY}
      CRON_KEY: ${CRON_KEY}
      DEBUG: ${DEBUG:-false}
      PAGE_CACHE: ${PAGE_CACHE:-false}
      SQL_CHECK: ${SQL_CHECK:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persistent runtime data (không mount source code để tránh ghi đè image build)
      - vvveb_storage:/var/www/html/storage
      - vvveb_page_cache:/var/www/html/public/page-cache
    networks:
      - vvveb_network

volumes:
  vvveb_db_data:
  vvveb_storage:
  vvveb_page_cache:

networks:
  vvveb_network:
    driver: bridge
