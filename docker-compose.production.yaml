version: "3.8"

# Build behavior:
# - php (build: .): luôn rebuild từ source code ở mỗi deploy
# - Để force rebuild: set COOLIFY_FORCE_BUILD=true và dùng `docker compose build --pull`
# - Chỉ deploy container php, không dùng image mysql

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: vvveb-app
    restart: always
    # Không expose port 80 trực tiếp - Coolify Traefik sẽ proxy qua labels
    # ports:
    #   - "80:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.vvveb.loadbalancer.server.port=80"
    environment:
      DB_HOST: localhost
      DB_DATABASE: ${MYSQL_DATABASE:-vvveb}
      DB_USER: ${MYSQL_USER:-vvveb}
      DB_PASSWORD: ${MYSQL_PASSWORD:-vvveb}
      DB_ENGINE: mysqli
      AUTO_INSTALL: "false"
      # Chạy container dưới user www-data để phù hợp quyền file
      APACHE_RUN_USER: www-data
      APACHE_RUN_GROUP: www-data
      # Secret — thiết lập trên Coolify Variables, KHÔNG hardcode
      APP_KEY: ${APP_KEY}
      CRON_KEY: ${CRON_KEY}
      DEBUG: ${DEBUG:-false}
      PAGE_CACHE: ${PAGE_CACHE:-false}
      SQL_CHECK: ${SQL_CHECK:-false}
      # Khi COOLIFY_FORCE_BUILD=true + docker compose build --pull, dịch vụ sẽ được rebuild
      COOLIFY_FORCE_BUILD: ${COOLIFY_FORCE_BUILD:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persistent runtime data (không mount source code để tránh ghi đè image build)
      - vvveb_storage:/var/www/html/storage
      - vvveb_page_cache:/var/www/html/public/page-cache
    networks:
      - vvveb_network

volumes:
  vvveb_storage:
  vvveb_page_cache:

networks:
  vvveb_network:
    driver: bridge
